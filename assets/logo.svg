<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Beyond the Board">
  <!--
    FALLBACK MARK ONLY. The brand mark is assets/avatar.png — see "The mark" in
    SKILL.md. Use this simplified vector only where a raster genuinely cannot go
    (an SVG favicon, a monochrome stamp). It follows the avatar's construction —
    solid split fills, dark outline, white keyline, at colours sampled from it —
    but it is not a redraw of the avatar and must not be treated as one.
  -->
  <defs>
    <g id="rdQueenShape">
      <circle cx="32" cy="7.6" r="3"/>
      <path d="M12.6 21.6 L15.5 12.6 L19.6 21.6 L23.75 12 L27.9 21.6 L32 11
               L36.1 21.6 L40.25 12 L44.4 21.6 L48.5 12.6 L51.4 21.6
               L49.8 26.8 L14.2 26.8 Z"/>
      <path d="M21.2 29.4 H42.8 C42.2 36 43.6 42 46 46.6 H18 C20.4 42 21.8 36 21.2 29.4 Z"/>
      <rect x="14.4" y="48.2" width="35.2" height="5" rx="2"/>
      <rect x="12" y="54.6" width="40" height="5.4" rx="2.4"/>
    </g>
    <clipPath id="rdLeft"><rect x="0" y="0" width="32" height="64"/></clipPath>
    <clipPath id="rdRight"><rect x="32" y="0" width="32" height="64"/></clipPath>
    <clipPath id="rdShapeClip"><use href="#rdQueenShape"/></clipPath>
    <filter id="rdGlow" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- outer neon glow, one hue each side -->
  <g filter="url(#rdGlow)" opacity=".85">
    <g clip-path="url(#rdLeft)"><use href="#rdQueenShape" fill="#FF3DA6"/></g>
    <g clip-path="url(#rdRight)"><use href="#rdQueenShape" fill="#4FD6EE"/></g>
  </g>

  <!-- solid split fills, sampled from the avatar -->
  <g clip-path="url(#rdLeft)"><use href="#rdQueenShape" fill="#E6026D"/></g>
  <g clip-path="url(#rdRight)"><use href="#rdQueenShape" fill="#005AB1"/></g>

  <!-- dark outline -->
  <use href="#rdQueenShape" fill="none" stroke="#08070F" stroke-width="2.2"
       stroke-linejoin="round" stroke-linecap="round"/>

  <!-- the keyline: white, hard, dead centre -->
  <g clip-path="url(#rdShapeClip)">
    <rect x="31.15" y="0" width="1.7" height="64" fill="#FFFFFF"/>
  </g>
</svg>
