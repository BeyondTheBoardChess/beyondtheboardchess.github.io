<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700">
  <!-- The tilt study's question as a picture (DA-469, Rainy's sketch A): five wins then a blank
       next game, five losses then a blank next game. It asks and never hints at the answer.
       Its words for anyone who can't see it are the study's picture_alt in _data/nav.yml. An image
       cannot read the site's colour tokens, so these are copied from site.css: #070C16 is
       --rd-void, #A7B2C9 is --rd-ink-muted, #FF3DA6 is the site's pink. -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A7B2C9"/>
    </marker>
  </defs>
  <rect width="1600" height="700" rx="24" fill="#070C16"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="700" text-anchor="middle">
    <g fill="#3BD68F">
      <rect x="150" y="130" width="150" height="150" rx="22"/>
      <rect x="340" y="130" width="150" height="150" rx="22"/>
      <rect x="530" y="130" width="150" height="150" rx="22"/>
      <rect x="720" y="130" width="150" height="150" rx="22"/>
      <rect x="910" y="130" width="150" height="150" rx="22"/>
    </g>
    <g fill="#FF6B61">
      <rect x="150" y="420" width="150" height="150" rx="22"/>
      <rect x="340" y="420" width="150" height="150" rx="22"/>
      <rect x="530" y="420" width="150" height="150" rx="22"/>
      <rect x="720" y="420" width="150" height="150" rx="22"/>
      <rect x="910" y="420" width="150" height="150" rx="22"/>
    </g>
    <g fill="#070C16" font-size="96">
      <text x="225" y="240">W</text><text x="415" y="240">W</text><text x="605" y="240">W</text><text x="795" y="240">W</text><text x="985" y="240">W</text>
      <text x="225" y="530">L</text><text x="415" y="530">L</text><text x="605" y="530">L</text><text x="795" y="530">L</text><text x="985" y="530">L</text>
    </g>
    <g stroke="#A7B2C9" stroke-width="10" stroke-linecap="round" marker-end="url(#head)">
      <line x1="1075" y1="205" x2="1128" y2="205"/>
      <line x1="1075" y1="495" x2="1128" y2="495"/>
    </g>
    <g fill="none" stroke="#FF3DA6" stroke-width="7" stroke-dasharray="20 14">
      <rect x="1150" y="130" width="150" height="150" rx="22"/>
      <rect x="1150" y="420" width="150" height="150" rx="22"/>
    </g>
    <g fill="#FF3DA6" font-size="104">
      <text x="1225" y="242">?</text>
      <text x="1225" y="532">?</text>
    </g>
    <g fill="#A7B2C9" font-weight="600" font-size="52">
      <text x="1225" y="100">Next game</text>
      <text x="1225" y="636">Next game</text>
    </g>
  </g>
</svg>
