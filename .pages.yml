# Pages CMS (app.pagescms.org): the editor the pencil on each page opens. DA-450.
#
# Every page on the site needs an entry here named for its path (Jekyll's slugify, so
# README.md is readme-md), or its pencil opens nothing. A page's body is edited as rich text,
# which rewrites the whole body on save, so page bodies hold plain markdown only: raw HTML
# such as <details> or <br> belongs in the page frame or an include. The check in
# _tools/editor-check proves both; run it after changing any page.
settings:
  hide: true
  content:
    merge: true
  commit:
    templates:
      create: Edited verbiage on site
      update: Edited verbiage on site
      delete: Edited verbiage on site
      rename: Edited verbiage on site
content:
  - name: readme-md
    label: Studies page
    type: file
    path: README.md
    format: yaml-frontmatter
    fields:
      - name: layout
        type: string
        hidden: true
      - name: permalink
        type: string
        hidden: true
      - name: body
        label: Words
        type: rich-text
        options:
          format: markdown
          switcher: false
          media: false
  - name: how-the-data-is-checked-md
    label: The Lichess Data page
    type: file
    path: how-the-data-is-checked.md
    format: yaml-frontmatter
    fields:
      - name: layout
        type: string
        hidden: true
      - name: month_tables
        type: boolean
        hidden: true
      - name: body
        label: Words
        description: "Words in curly brackets, like {months}, are filled in with the latest numbers from the check of the games, so keep them as they are. Words between a pair like {verdict} and {/verdict} show only when the check comes back normal; if it finds a problem, a sentence saying so shows in their place. The month table, with each file's fingerprint in its last column, is filled in the same way and its words are under Words on every page."
        type: rich-text
        options:
          format: markdown
          switcher: false
          media: false
  - name: performance-after-wins-or-losses-method-md
    label: "Study: What happens after consecutive wins or losses, Method tab"
    type: file
    path: performance-after-wins-or-losses/method.md
    format: yaml-frontmatter
    fields:
      - name: layout
        type: string
        hidden: true
      - name: title
        type: string
        hidden: true
      - name: study
        type: string
        hidden: true
      - name: tab
        type: string
        hidden: true
      - name: body
        label: Words
        description: A number in a gold box is still being counted.
        type: rich-text
        options:
          format: markdown
          switcher: false
          media: false
  - name: words
    label: Words on every page
    type: file
    path: _data/words.yml
    format: yaml
    fields:
      - { name: studies, label: "Menu: link to the Studies page", type: string }
      - { name: all_studies, label: "Study page: link back to all studies", type: string }
      - { name: findings_tab, label: "Study page: Findings tab", type: string }
      - { name: method_tab, label: "Study page: Method tab", type: string }
      - { name: menu, label: "Menu button, while the menu is open", type: string }
      - { name: hide_menu, label: "Menu button hint when the menu is open", type: string }
      - { name: show_menu, label: "Menu button hint when the menu is collapsed (the button is just its icon then)", type: string }
      - { name: expand_all, label: "Method page: button above the parts that opens them all", type: string }
      - { name: collapse_all, label: "Method page: the same button once every part is open", type: string }
      - { name: sections_heading, label: "Method page: small heading over the list of parts to jump to", type: string }
      - { name: widen_studies, label: "Menu: hint on the arrow beside Studies that widens the menu to each study's full question", type: string }
      - { name: narrow_studies, label: "Menu: hint on the same arrow once the menu is wide", type: string }
      - { name: no_studies_title, label: "Studies page with no studies: heading", type: string }
      - { name: no_studies_text, label: "Studies page with no studies: sentence", type: text }
      - { name: months_heading, label: "The Lichess Data page: heading over the month table", type: string }
      - { name: months_summary_bold, label: "The Lichess Data page: month table, bold words ({months} is filled in with the number of months)", type: string }
      - { name: months_summary_rest, label: "The Lichess Data page: month table, words after the bold", type: string }
      - { name: months_download, label: "The Lichess Data page: button that downloads the month table", type: string }
      - { name: months_no_fingerprint, label: "The Lichess Data page: month table, in place of a fingerprint nobody recorded", type: string }
      - { name: pencil, label: "The pencil's hint (only you see it)", type: string }
      - { name: under_construction, label: "Studies page: note on a study that isn't finished", type: string }
  - name: study-titles
    label: Study titles and The Lichess Data
    type: file
    path: _data/nav.yml
    format: yaml
    fields:
      - name: studies
        label: Studies
        type: object
        list: true
        fields:
          - { name: key, type: string, hidden: true }
          - { name: title, label: Title, type: string }
          - { name: url, type: string, hidden: true }
          - { name: method_url, type: string, hidden: true }
          - { name: under_construction, label: Under Construction, type: boolean }
          - { name: picture, type: string, hidden: true }
          - { name: picture_alt, label: "Picture, in words (for anyone who can't see it)", type: string }
      - name: data
        label: The Lichess Data
        type: object
        fields:
          - { name: title, label: Menu name, type: string }
          - { name: url, type: string, hidden: true }
